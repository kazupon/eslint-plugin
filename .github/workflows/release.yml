name: Release

# Triggers:
#   - tag push (v*): publish to npm, then create the GitHub Release on success.
#   - workflow_dispatch: fallback recovery. Pick which job to run for an existing tag
#     (npm-publish / release-notes / all).
#
# CHANGELOG.md is already part of the tagged release commit produced by `pnpm release`
# (bumpp and gh-changelogen). This workflow does not generate or commit the changelog.
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        required: true
        default: all
        options:
          - all
          - npm-publish
          - release-notes
      tag:
        description: Existing tag to release (e.g. v1.2.3)
        type: string
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions: {}

jobs:
  npm-publish:
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'npm-publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publisher

    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Resolve dist-tag from tag
        id: meta
        # SemVer prerelease: publish it under its first identifier, such as `beta` for
        # v1.0.0-beta.1, so that `latest` stays on the last stable release. Use `next` for an
        # identifier that starts with a digit, since npm rejects a dist-tag that is a semver
        # range, such as `0` of v1.0.0-0.
        run: |
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z][0-9A-Za-z-]*) ]]; then
            echo "dist_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm 11.5 or later (Node.js 24) is needed for OIDC trusted publishing.
          # No dependency cache in the job that publishes the package.
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # `prepack` builds the package. OIDC trusted publisher: no NPM_TOKEN is needed, and
        # the provenance is signed. `--no-git-checks`: the tag is checked out on a detached HEAD.
        run: pnpm publish --access public --no-git-checks --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}

  release-notes:
    needs:
      - npm-publish
    if: >-
      always() && (
        (github.event_name == 'push' && needs.npm-publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'release-notes') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'all' &&
          needs.npm-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Create GitHub Release (idempotent)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            FLAGS=(--verify-tag --generate-notes)
            # SemVer prerelease: '-' after major.minor.patch, not build metadata.
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
